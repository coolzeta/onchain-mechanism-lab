server {
    listen 80;
    server_name lab.zeta.lol;

    access_log /www/sites/lab.zeta.lol/log/access.log main;
    error_log /www/sites/lab.zeta.lol/log/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/lab.zeta.lol/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lab.zeta.lol;

    access_log /www/sites/lab.zeta.lol/log/access.log main;
    error_log /www/sites/lab.zeta.lol/log/error.log;

    ssl_certificate /www/sites/n8n.zeta.lol/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/n8n.zeta.lol/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3205;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
